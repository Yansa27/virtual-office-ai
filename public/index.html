<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jasvero Virtual Office — 2D Retro & AI Fleet</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2310b981'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='%230f172a' font-family='system-ui' font-weight='900'>J</text></svg>">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div id="login" class="login-wrap hidden">
    <div class="login-ambient"></div>
    <form id="loginForm" class="login-card" autocomplete="off">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Jasvero Digital</div>
          <div class="brand-sub">Virtual Office AI</div>
        </div>
      </div>
      <div class="login-badge">
        <span class="live-dot pulse"></span> Kantor AI 2D · Stardew Valley Theme
      </div>
      <label class="fld">Username
        <input id="lu" type="text" value="admin" autocomplete="username" placeholder="Masukkan username">
      </label>
      <label class="fld">Password
        <input id="lp" type="password" value="admin" autocomplete="current-password" placeholder="Masukkan password">
      </label>
      <div id="loginErr" class="err"></div>
      <button type="submit" class="btn primary block">
        <span>Masuk ke Kantor</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
      <div class="login-hint">Mode otomatis: terhubung ke server Hermes atau simulasi mandiri.</div>
    </form>
  </div>

  <!-- ============ APP ============ -->
  <div id="app" class="hidden">
    <aside class="side">
      <div class="brand side-brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Jasvero</div>
          <div class="brand-sub">Virtual Office AI</div>
        </div>
      </div>

      <div class="side-pill">
        <span class="live-dot pulse"></span>
        <span id="sideFleetStatus">5 Agen Aktif</span>
      </div>

      <nav id="nav" class="nav">
        <button data-view="dashboard" class="active">
          <span class="ic-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </span>
          <span class="lbl">Dashboard</span>
        </button>

        <button data-view="kantor">
          <span class="ic-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          </span>
          <span class="lbl">Kantor 2D</span>
          <span class="tag-badge">Pixel</span>
        </button>

        <button data-view="chat">
          <span class="ic-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </span>
          <span class="lbl">Chat AI</span>
          <span class="notif-dot"></span>
        </button>

        <button data-view="log">
          <span class="ic-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1" fill="currentColor"/><circle cx="3.5" cy="12" r="1" fill="currentColor"/><circle cx="3.5" cy="18" r="1" fill="currentColor"/></svg>
          </span>
          <span class="lbl">Log Aktivitas</span>
        </button>

        <button data-view="tim">
          <span class="ic-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </span>
          <span class="lbl">Tim</span>
        </button>

        <button data-view="board">
          <span class="ic-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
          </span>
          <span class="lbl">Board Kanban</span>
        </button>

        <button data-view="proyek">
          <span class="ic-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          </span>
          <span class="lbl">Proyek</span>
        </button>

        <button data-view="monitor">
          <span class="ic-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          </span>
          <span class="lbl">Monitor</span>
        </button>

        <button data-view="hasil">
          <span class="ic-wrap">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          <span class="lbl">Hasil Kerja</span>
        </button>
      </nav>

      <div class="side-foot">
        <div class="me">
          <div class="avatar" id="meAvatar">A</div>
          <div class="me-txt">
            <div id="meName" class="me-name">Admin</div>
            <div class="me-role">Workspace Manager</div>
          </div>
        </div>
        <button id="logout" class="ghost block">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Keluar</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <div class="top-titles">
          <h1 id="title">Dashboard</h1>
          <div id="sub" class="sub">Ringkasan kantor & aktivitas agen</div>
        </div>
        <div class="top-right">
          <!-- Audio Controls -->
          <div class="audio-panel">
            <button id="bgmBtn" class="tool-btn" title="Toggle Musik Lofi Cozy">
              <span class="ic">🎵</span>
              <span class="btn-txt">BGM: <b id="bgmState">Off</b></span>
            </button>
            <button id="sfxBtn" class="tool-btn" title="Toggle Suara Efek">
              <span class="ic">🔊</span>
              <span class="btn-txt">SFX: <b id="sfxState">On</b></span>
            </button>
          </div>

          <div id="clock" class="clock">—</div>
          <button id="quickPartyBtn" class="btn warm-btn" title="Kirim semua agen santai ke Party & Ngopi!">
            <span>☕ Party & Ngopi</span>
          </button>
          <button id="refresh" class="ghost" title="Refresh data">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            <span class="hide-mobile">Refresh</span>
          </button>
        </div>
      </header>

      <section id="view" class="view"></section>
    </main>

    <!-- Bottom Mobile Nav -->
    <nav class="bottomnav">
      <button data-view="dashboard" class="active">
        <span class="ic-wrap"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
        <span class="lbl">Home</span>
      </button>
      <button data-view="kantor">
        <span class="ic-wrap"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/></svg></span>
        <span class="lbl">Kantor</span>
      </button>
      <button data-view="chat">
        <span class="ic-wrap"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
        <span class="lbl">Chat AI</span>
      </button>
      <button data-view="log">
        <span class="ic-wrap"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1" fill="currentColor"/><circle cx="3.5" cy="12" r="1" fill="currentColor"/><circle cx="3.5" cy="18" r="1" fill="currentColor"/></svg></span>
        <span class="lbl">Log</span>
      </button>
      <button data-view="board">
        <span class="ic-wrap"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg></span>
        <span class="lbl">Board</span>
      </button>
      <button data-view="monitor">
        <span class="ic-wrap"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
        <span class="lbl">Monitor</span>
      </button>
    </nav>
  </div>

  <!-- ============ MODAL TASK ============ -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title-wrap">
          <div class="modal-badge">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </div>
          <h3 id="modalTitle">Task Baru</h3>
        </div>
        <button id="modalClose" class="ghost close-btn">✕</button>
      </div>

      <label class="fld">Judul Task
        <input id="tTitle" type="text" placeholder="Apa yang perlu diselesaikan agen?">
      </label>

      <label class="fld">Deskripsi & Kriteria Selesai
        <textarea id="tBody" rows="4" placeholder="Detail instruksi, konteks, ekspektasi output…"></textarea>
      </label>

      <div class="row">
        <label class="fld">Tugaskan ke Agen
          <select id="tAssignee"></select>
        </label>
        <label class="fld">Tingkat Prioritas
          <select id="tPriority">
            <option value="0">Normal (Standar)</option>
            <option value="1">Penting (Prioritas)</option>
            <option value="2">Mendesak (Critical)</option>
          </select>
        </label>
      </div>

      <div id="taskErr" class="err"></div>

      <div class="modal-foot">
        <button id="taskCancel" class="ghost">Batal</button>
        <button id="taskSave" class="btn primary">
          <span>Buat & Tugaskan</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ============ DRAWER / POPOVER AGEN ============ -->
  <div id="agentPop" class="agent-pop hidden">
    <div class="agent-pop-head">
      <div class="avatar" id="apAv">?</div>
      <div class="ap-titles">
        <div id="apName" class="ap-name">—</div>
        <div id="apRole" class="ap-role">—</div>
      </div>
      <button id="apClose" class="ghost close-btn">✕</button>
    </div>

    <!-- Quick Interactive Actions for the Agent -->
    <div class="agent-quick-actions">
      <button id="apActionChat" class="btn-chip" title="Buka ruang obrolan dengan agen ini">
        <span>💬 Buka Chat AI</span>
      </button>
      <button id="apActionCoffee" class="btn-chip" title="Ajak agen ini ngopi santai di Pantry">
        <span>☕ Ajak Ngopi</span>
      </button>
      <button id="apActionMeeting" class="btn-chip" title="Panggil ke Ruang Rapat">
        <span>📢 Ke Ruang Rapat</span>
      </button>
      <button id="apActionDesk" class="btn-chip" title="Kembalikan agen ke meja kerja">
        <span>💻 Balik ke Meja</span>
      </button>
    </div>

    <div class="ap-section-lbl">Daftar Task Agen:</div>
    <div id="apBody" class="ap-body"></div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
