<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jasvero Virtual Office</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2322d3ee'/><text x='50' y='68' font-size='58' text-anchor='middle' fill='%230a0e16' font-family='system-ui' font-weight='700'>J</text></svg>">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div id="login" class="login-wrap hidden">
    <form id="loginForm" class="login-card" autocomplete="off">
      <div class="brand">
        <div class="brand-mark">J</div>
        <div>
          <div class="brand-name">Jasvero Digital</div>
          <div class="brand-sub">Virtual Office</div>
        </div>
      </div>
      <label class="fld">Username
        <input id="lu" type="text" value="admin" autocomplete="username">
      </label>
      <label class="fld">Password
        <input id="lp" type="password" autocomplete="current-password">
      </label>
      <div id="loginErr" class="err"></div>
      <button type="submit" class="btn primary block">Masuk</button>
      <div class="login-hint">Pakai akun dashboard Hermes kamu.</div>
    </form>
  </div>

  <!-- ============ APP ============ -->
  <div id="app" class="hidden">
    <aside class="side">
      <div class="brand side-brand">
        <div class="brand-mark">J</div>
        <div>
          <div class="brand-name">Jasvero</div>
          <div class="brand-sub">Virtual Office</div>
        </div>
      </div>

      <nav id="nav" class="nav">
        <button data-view="dashboard"><span class="ic">🏠</span><span class="lbl">Dashboard</span></button>
        <button data-view="kantor"><span class="ic">🏢</span><span class="lbl">Kantor</span></button>
        <button data-view="tim"><span class="ic">👥</span><span class="lbl">Tim</span></button>
        <button data-view="board"><span class="ic">📋</span><span class="lbl">Board</span></button>
        <button data-view="proyek"><span class="ic">📁</span><span class="lbl">Proyek</span></button>
        <button data-view="monitor"><span class="ic">📊</span><span class="lbl">Monitor</span></button>
        <button data-view="hasil"><span class="ic">📦</span><span class="lbl">Hasil</span></button>
      </nav>

      <div class="side-foot">
        <div class="me">
          <div class="avatar" id="meAvatar">?</div>
          <div class="me-txt">
            <div id="meName" class="me-name">—</div>
            <div class="me-role">Admin</div>
          </div>
        </div>
        <button id="logout" class="ghost block">Keluar</button>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <div>
          <h1 id="title">Dashboard</h1>
          <div id="sub" class="sub">Ringkasan kantor</div>
        </div>
        <div class="top-right">
          <div id="clock" class="clock">—</div>
          <button id="refresh" class="ghost">↻ Refresh</button>
          <button class="ghost" data-go="monitor">＋ Tab Monitor</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>

    <nav class="bottomnav">
      <button data-view="dashboard"><span class="ic">🏠</span><span class="lbl">Dashboard</span></button>
      <button data-view="kantor"><span class="ic">🏢</span><span class="lbl">Kantor</span></button>
      <button data-view="tim"><span class="ic">👥</span><span class="lbl">Tim</span></button>
      <button data-view="board"><span class="ic">📋</span><span class="lbl">Board</span></button>
      <button data-view="proyek"><span class="ic">📁</span><span class="lbl">Proyek</span></button>
      <button data-view="monitor"><span class="ic">📊</span><span class="lbl">Monitor</span></button>
      <button data-view="hasil"><span class="ic">📦</span><span class="lbl">Hasil</span></button>
    </nav>
  </div>

  <!-- ============ MODAL TASK ============ -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modalTitle">Task baru</h3>
        <button id="modalClose" class="ghost">✕</button>
      </div>
      <label class="fld">Judul<input id="tTitle" type="text" placeholder="Apa yang mau dikerjakan?"></label>
      <label class="fld">Deskripsi<textarea id="tBody" rows="4" placeholder="Detail, konteks, kriteria selesai…"></textarea></label>
      <div class="row">
        <label class="fld">Assignee
          <select id="tAssignee"></select>
        </label>
        <label class="fld">Prioritas
          <select id="tPriority">
            <option value="0">Normal</option>
            <option value="1">Penting</option>
            <option value="2">Mendesak</option>
          </select>
        </label>
      </div>
      <div id="taskErr" class="err"></div>
      <div class="modal-foot">
        <button id="taskCancel" class="ghost">Batal</button>
        <button id="taskSave" class="btn primary">Buat Task</button>
      </div>
    </div>
  </div>

  <!-- ============ POPOVER AGEN ============ -->
  <div id="agentPop" class="agent-pop hidden">
    <div class="agent-pop-head">
      <div class="avatar" id="apAv">?</div>
      <div><div id="apName" class="ap-name">—</div><div id="apRole" class="ap-role">—</div></div>
      <button id="apClose" class="ghost">✕</button>
    </div>
    <div id="apBody" class="ap-body"></div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
